name: Выпустить для всех
# Запуск вручную, когда владелец проверил тестовую версию у себя («выпускай»): manifest-beta.json →
# manifest.json (основной канал) без пересборки, затем сайт. Файлы версии уже на Диске и подписаны.
# version — какую версию выпускаем (защита от случайного выпуска другой). Отката назад нет: только новой версией.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия из тестового канала, например 0.4.20'
        required: true
      ref:
        description: 'Ветка для сайта и справки'
        default: main
permissions:
  contents: write   # выпуск GitHub — запасной путь на Диск
concurrency:
  group: promote
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Тестовый → основной
        env:
          T: ${{ secrets.YADISK_TOKEN }}
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PY: python3
        run: |
          set -e
          pip install -q cryptography
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          get() { curl -s -L -o "$2" "$(curl -s -H "$A" "$API/download?path=$(enc "$1")" | python3 -c "import json,sys;print(json.load(sys.stdin).get('href',''))")"; }
          get disk:/Yo-ho/manifest-beta.json beta.json
          got=$(python3 -c "import json;print(json.load(open('beta.json'))['version'])")
          [ "$got" = "$V" ] || { echo "::error title=Выпуск::в тестовом канале $got, а не $V"; exit 1; }
          KEY=$(grep -o "updatePublicKey = '[^']*'" lib/core/keys.dart | cut -d"'" -f2)
          [ "$(python3 -c "import json;print(json.load(open('beta.json'))['key'])")" = "$KEY" ] || { echo "::error title=Подпись::ключ манифеста не совпадает с ключом в программе"; exit 1; }
          # Все файлы версии на месте и совпадают по размеру?
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.parse
          m = json.load(open('beta.json'))
          A = 'Authorization: OAuth ' + os.environ['T']
          bad = 0
          for f in m['files']:
              p = urllib.parse.quote(f"disk:/Yo-ho/{m['version']}/{f['name']}", safe='')
              r = subprocess.run(['curl', '-s', '-H', A, f'https://cloud-api.yandex.net/v1/disk/resources?path={p}&fields=size'], capture_output=True, text=True).stdout
              if json.loads(r or '{}').get('size') != f['size']:
                  bad += 1
                  print(f"::error title=Яндекс Диск::нет или не тот размер: {f['name']}")
          sys.exit(1 if bad else 0)
          PY
          up() { # файл → путь на Диске. Сначала напрямую; если Яндекс не даёт ссылку (лимит загрузки
                 # DiskUploadTrafficLimitExceeded) — файл идёт в выпуск GitHub v$VERSION, а Диск сам скачивает его по ссылке.
                 # Имя файла = имя на Диске. Сервера загрузки Диска бывают медленными: < 1 МБ/с дольше минуты — заново.
            for i in 1 2 3 4 5 6; do
              lim="--speed-limit 1000000 --speed-time 60"; [ $i = 6 ] && lim=""
              href=$(curl -s -H "$A" "$API/upload?path=$(enc "$2")&overwrite=true" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              [ -z "$href" ] && break
              code=$(curl -s -o /dev/null -w '%{http_code}' $lim --max-time 3600 -T "$1" "$href" || true)
              case "$code" in 200|201|202) echo "$(basename "$1"): загружен"; return 0;; esac
              echo "$(basename "$1"): попытка $i не удалась ($code)"; sleep 5
            done
            echo "$(basename "$1"): напрямую Диск не принимает — через выпуск GitHub"
            gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
                --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
            for i in 1 2 3; do gh release upload "v$VERSION" "$1" --clobber -R "$GITHUB_REPOSITORY" && break; sleep 10; done
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$1")"
            for i in 1 2 3; do
              curl -s -o /dev/null -X DELETE -H "$A" "$API?path=$(enc "$2")&permanently=true" || true
              sleep 3
              op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "$2")&url=$(enc "$url")" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              if [ -n "$op" ]; then
                for k in $(seq 1 360); do
                  st=$(curl -s -H "$A" "$op" | $PY -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
                  [ "$st" = success ] && { echo "$(basename "$1"): Диск скачал с GitHub"; return 0; }
                  [ "$st" = failed ] && break
                  sleep 10
                done
              fi
              echo "$(basename "$1"): Диск не скачал по ссылке (попытка $i)"; sleep 15
            done
            echo "::error title=Яндекс Диск::Не загрузился $(basename "$1")"; return 1
          }
          cp beta.json manifest.json
          VERSION="$V" up manifest.json disk:/Yo-ho/manifest.json
          bash tool/disk_current.sh "$V"
          echo "::notice title=Выпуск::Yo-ho $V — теперь у всех (программа найдёт обновление в течение получаса)"
