name: Выпустить для всех
on:
  workflow_dispatch:
    inputs:
      version:
        description: Проверенная тестовая версия (например 0.8.94)
        required: true
        type: string
      dry_run:
        description: Только проверка, не выпускать
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: [stable-check-request.json]

permissions:
  contents: read

concurrency:
  group: android-tv-stable-promotion
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.request.outputs.version }}
      previous: ${{ steps.request.outputs.previous }}
      manifest_sha: ${{ steps.digest.outputs.manifest_sha }}
      apk_sha: ${{ steps.digest.outputs.apk_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate version and download existing beta and current stable
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(jq -er '.version | strings' stable-check-request.json)
          fi
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          STABLE=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          [[ "$STABLE" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          export VERSION STABLE
          python3 -c 'import os; assert tuple(map(int,os.environ["VERSION"].split("."))) > tuple(map(int,os.environ["STABLE"][1:].split(".")))'
          gh api "repos/$GH_REPO/releases/tags/v$VERSION" > candidate.json
          jq -e --arg apk "Yo-ho-$VERSION.apk" --arg tag "v$VERSION" '.tag_name==$tag and .prerelease and (.draft|not) and ([.assets[]|select(.state=="uploaded")|.name]|sort)==([$apk,"manifest-beta.json"]|sort)' candidate.json >/dev/null
          gh release download "v$VERSION" --repo "$GH_REPO" --pattern "Yo-ho-$VERSION.apk" --pattern manifest-beta.json --dir out
          gh release download "$STABLE" --repo "$GH_REPO" --pattern "Yo-ho-${STABLE#v}.apk" --dir previous
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STABLE=$STABLE" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$STABLE" >> "$GITHUB_OUTPUT"
      - name: Independently verify signed APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile
          v = os.environ["VERSION"]
          p = pathlib.Path("out")
          name = f"Yo-ho-{v}.apk"
          assert {x.name for x in p.iterdir()} == {name, "manifest-beta.json"}
          m = json.loads((p / "manifest-beta.json").read_text())
          key = "EqFtZwl1Pijcsn8lhxOenM9mRvqAHnIfINZ8kEZ5eYM="
          assert m["app"] == "yo-ho" and m["version"] == v and m["key"] == key
          assert len(m["files"]) == 1
          f = m["files"][0]
          assert f["name"] == name and f["kind"] == "apk"
          data = (p / name).read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          assert len(data) == f["size"] and sha == f["sha256"]
          with tempfile.TemporaryDirectory() as tmp:
              t = pathlib.Path(tmp)
              (t/"pub.der").write_bytes(bytes.fromhex("302a300506032b6570032100") + base64.b64decode(key, validate=True))
              (t/"msg").write_bytes(f"yo-ho-update-v1\n{name}\n{sha}\n{v}".encode())
              (t/"sig").write_bytes(base64.b64decode(f["sig"], validate=True))
              subprocess.run(["openssl","pkeyutl","-verify","-pubin","-inkey",str(t/"pub.der"),"-keyform","DER","-rawin","-in",str(t/"msg"),"-sigfile",str(t/"sig")],check=True)
          print("Signed beta files verified")
          PY
      - name: Verify Android signing certificate, package name and versionCode
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="out/Yo-ho-$VERSION.apk"
          OLD="previous/Yo-ho-${STABLE#v}.apk"
          echo "Verifying candidate Android signature"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > new.sign 2>&1 || { cat new.sign; exit 1; }
          echo "Verifying current stable Android signature"
          "$BT/apksigner" verify --verbose --print-certs "$OLD" > old.sign 2>&1 || { cat old.sign; exit 1; }
          python3 - <<'PY'
          import re
          def cert(path):
              s=open(path).read()
              found=re.findall(r"(?im)^[ \t]*(?:Signer #\d+|V[123](?:\.\d+)? Signer(?: #\d+)?):?[ \t]+certificate SHA-256 digest:[ \t]*([0-9a-f:]+)[ \t]*$",s)
              if not found:
                  print(s)
                  raise SystemExit("No Android signer certificate digest found")
              digests={x.replace(":","").lower() for x in found}
              assert all(len(x)==64 for x in digests), "Invalid signer certificate digest"
              return sorted(digests)
          assert cert("new.sign")==cert("old.sign"), "Android signing certificates differ"
          print("Android signing certificates match")
          PY
          echo "Reading candidate Android package metadata"
          "$BT/aapt2" dump badging "$APK" > new.badging || { head -n 2 new.badging; exit 1; }
          echo "Reading current stable Android package metadata"
          "$BT/aapt2" dump badging "$OLD" > old.badging || { head -n 2 old.badging; exit 1; }
          python3 - <<'PY'
          import os,re
          def package(path):
              line=open(path).readline()
              m=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",line)
              assert m, 'missing package metadata'
              return m[1],int(m[2]),m[3]
          new,old=package("new.badging"),package("old.badging")
          assert new[0]==old[0]=="app.deepcinema.deep_cinema"
          assert new[1]>old[1] and new[2]==os.environ["VERSION"]
          assert old[2]==os.environ["STABLE"][1:]
          print("Android signing certificates and package match; versionCode increases")
          PY
          echo "manifest_sha=$(sha256sum out/manifest-beta.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$STABLE" ]]
          echo "Verification passed: stable still $STABLE"

  promote:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      STABLE: ${{ needs.verify.outputs.previous }}
      MANIFEST_SHA: ${{ needs.verify.outputs.manifest_sha }}
      APK_SHA: ${{ needs.verify.outputs.apk_sha }}
    steps:
      - name: Promote only the verified beta without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK="Yo-ho-$VERSION.apk"
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$STABLE" ]]
          gh api "repos/$GH_REPO/releases/tags/$TAG" > candidate.json
          jq -e --arg apk "$APK" --arg ad "sha256:$APK_SHA" --arg md "sha256:$MANIFEST_SHA" '.prerelease and (.draft|not) and ([.assets[]|select(.state=="uploaded" and ((.name==$apk and .digest==$ad) or (.name=="manifest-beta.json" and .digest==$md)))]|length)==2 and ([.assets[].name]|sort)==([$apk,"manifest-beta.json"]|sort)' candidate.json >/dev/null
          gh release download "$TAG" --repo "$GH_REPO" --pattern manifest-beta.json --dir out
          echo "$MANIFEST_SHA  out/manifest-beta.json" | sha256sum -c -
          cp out/manifest-beta.json out/manifest.json
          gh release upload "$TAG" out/manifest.json --repo "$GH_REPO"
          gh api "repos/$GH_REPO/releases/tags/$TAG" > staged.json
          jq -e --arg md "sha256:$MANIFEST_SHA" '.prerelease and (.draft|not) and any(.assets[]; .name=="manifest.json" and .digest==$md and .state=="uploaded")' staged.json >/dev/null
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$STABLE" ]]
          gh release edit "$TAG" --repo "$GH_REPO" --prerelease=false --latest=true --title "Yo-ho $VERSION · Android TV"
          gh api "repos/$GH_REPO/releases/latest" > latest.json
          jq -e --arg tag "$TAG" --arg apk "$APK" --arg md "sha256:$MANIFEST_SHA" --arg ad "sha256:$APK_SHA" '.tag_name==$tag and (.prerelease|not) and (.draft|not) and any(.assets[]; .name=="manifest.json" and .digest==$md and .state=="uploaded") and any(.assets[]; .name==$apk and .digest==$ad and .state=="uploaded")' latest.json >/dev/null
          echo "Published stable $TAG; previous $STABLE"
