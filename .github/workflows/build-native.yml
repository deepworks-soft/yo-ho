name: Сборка Yo-ho для ТВ (новая основа)
run-name: Yo-ho Core B0 test ${{ inputs.version || '0.8.46' }}

# Новая ТВ-версия на родном Android (Kotlin + Compose, папка native/ в закрытом deep-cinema; план — docs/NATIVE.md).
# Запуск вручную, только после «да» владельца. Пока новая версия не умеет всё, что 0.7.7, — ТОЛЬКО тестовый канал
# (manifest-beta.json, видит лишь владелец с «Тестовыми версиями»); выбора «всем» здесь нет.
#
# Что делает: берёт код из ветки (по умолчанию native), скачивает торрент-движок, собирает APK тем же ключом
# подписи, что у Flutter-версии (секрет ANDROID_KEYSTORE_B64) — поэтому обновление встаёт поверх 0.7.7 и данные
# остаются; проверяет подпись; подписывает файлы для обновлятора (tool/update_sign.py) и кладёт их на Яндекс Диск
# (обход лимита — через выпуск GitHub, как в build.yml); последним — manifest-beta.json; пишет владельцу в Telegram.
# disk=no — только файлы в артефакты сборки (проверить, что собирается; на Диск ничего не идёт).
# Номер сборки = 5000 + номер запуска: заведомо больше, чем у Flutter-версии (1100 + запуск).
on:
  push:
    branches: [experiment/yoho-core]
    paths:
      - '.github/workflows/build-native.yml'
      - '.github/yoho-core-build-request.txt'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер версии, например 0.8.0'
        required: true
      notes:
        description: 'Что нового'
        default: 'Тестовая версия на новой основе'
      ref:
        description: 'Ветка кода'
        default: native
      disk:
        description: 'Выкладывать на Яндекс Диск в тестовый канал (no — только файлы в артефакты)'
        default: 'no'

permissions:
  contents: read # experiment is artifact-only

concurrency:
  group: yoho-core-b0-experiment
  cancel-in-progress: false

jobs:
  android:
    name: Android TV (новая основа)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse publication from B0 workflow
        env:
          SOURCE_REF: ${{ inputs.ref || 'experiment/yoho-core' }}
          PUBLISH: ${{ inputs.disk || 'no' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/yoho-core"
          test "$SOURCE_REF" = "experiment/yoho-core"
          test "$PUBLISH" = "no"

      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref || 'experiment/yoho-core' }}
          persist-credentials: false

      - name: Номер версии
        env:
          V: ${{ inputs.version || '0.8.46' }}
        run: |
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error title=Версия::неверный номер версии"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(( 5000 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Торрент-движок для Android (TorrServer)
        if: ${{ (inputs.ref || 'experiment/yoho-core') != 'experiment/yoho-core' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Версия движка закреплена: с 14.11 «latest» — новая ветка Silo.x, она у нас не запускается.
          gh api repos/YouROK/TorrServer/releases/tags/MatriX.150 > ts.json
          pick() { jq -r --arg re "$1" '[.assets[] | select(.name|test($re;"i"))][0].browser_download_url // empty' ts.json; }
          A64=$(pick 'android.*arm64'); A7=$(pick 'android.*arm(v)?7')
          echo "arm64: $A64"; echo "arm7: $A7"
          J=native/app/src/main/jniLibs
          mkdir -p $J/arm64-v8a $J/armeabi-v7a
          [ -n "$A64" ] && curl -fsSL "$A64" -o $J/arm64-v8a/libtorrserver.so
          [ -n "$A7" ] && curl -fsSL "$A7" -o $J/armeabi-v7a/libtorrserver.so
          ls -la $J/*/ || true
          if [ -z "$A64" ]; then echo "::warning::TorrServer для Android не скачан — сборка без встроенного движка"; fi
          exit 0


      - uses: actions/setup-go@v5
        if: ${{ (inputs.ref || 'experiment/yoho-core') == 'experiment/yoho-core' }}
        with:
          go-version: '1.25.7'
          cache: false

      - name: Build and test pinned Yo-ho Core B0 plus verified Original
        if: ${{ (inputs.ref || 'experiment/yoho-core') == 'experiment/yoho-core' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=0c48c9ac78de2864f5fc9341e8caf89d355a4850
          SRC="$RUNNER_TEMP/yoho-core-b0-src"
          OUT="$GITHUB_WORKSPACE/native/app/src/main/jniLibs"
          NDK_VERSION=27.2.12479018
          mkdir -p "$SRC" "$OUT"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin https://github.com/YouROK/TorrServer.git
          git -C "$SRC" fetch --depth=1 origin "$BASE"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$BASE"
          test -f "$SRC/server/web/pages/template/pages/index.html"
          export GOTOOLCHAIN=local
          go version
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          TC="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TC/aarch64-linux-android21-clang"
          cd "$SRC/server"
          go mod download
          go mod verify
          go mod vendor
          go test -mod=vendor -tags=nosqlite -timeout=8m ./torr/storage/torrstor ./torr ./web/api
          build_one() {
            local abi="$1" arch="$2" cc="$3" upstream="$4" hash="$5"
            mkdir -p "$OUT/$abi"
            curl -fsSL --retry 3 "https://github.com/YouROK/TorrServer/releases/download/MatriX.150/TorrServer-android-$upstream" -o "$OUT/$abi/libtorrserver.so"
            printf '%s  %s\n' "$hash" "$OUT/$abi/libtorrserver.so" | sha256sum -c -
            CC="$TC/$cc" CGO_ENABLED=1 GOOS=android GOARCH="$arch" GOARM=7 \
              go build -mod=vendor -ldflags="-s -w -checklinkname=0 -X server/version.Version=YohoCore.B0.150" -tags=nosqlite -trimpath -o "$OUT/$abi/libyohocore.so" ./cmd
            test -s "$OUT/$abi/libyohocore.so"
            "$TC/llvm-readelf" -h "$OUT/$abi/libyohocore.so"
          }
          build_one arm64-v8a arm64 aarch64-linux-android21-clang arm64 760f18c6837c7fc1c440726a14e7534e3baca914b780fbc3ec28a38b6158aaf0
          build_one armeabi-v7a arm armv7a-linux-androideabi21-clang arm7 852e15b8d4739ac94ce0e046bba5c7a929b2ad75f980849cef10c668971ee764
          build_one x86_64 amd64 x86_64-linux-android21-clang amd64 b0ffd094e22e09b41e171bc0f06f865bcd8da9e089501e58d65b5dbe79249d54
          cd "$OUT"
          sha256sum */libtorrserver.so */libyohocore.so > "$RUNNER_TEMP/yoho-core-b0-sha256.txt"
          printf 'Upstream commit: %s\nGo: %s\nNDK: %s\nVersion: YohoCore.B0.150\n' "$BASE" "$(go version)" "$NDK_VERSION" > "$RUNNER_TEMP/yoho-core-b0-provenance.txt"
          # Archive only public engine sources and vendored dependencies, never APK app sources.
          tar --exclude=.git -czf "$RUNNER_TEMP/yoho-core-b0-source.tar.gz" -C "$SRC" .

      - name: Upload B0 corresponding engine sources and checksums
        if: ${{ (inputs.ref || 'experiment/yoho-core') == 'experiment/yoho-core' }}
        uses: actions/upload-artifact@v4
        with:
          name: yoho-core-b0-source-and-provenance
          path: |
            ${{ runner.temp }}/yoho-core-b0-source.tar.gz
            ${{ runner.temp }}/yoho-core-b0-sha256.txt
            ${{ runner.temp }}/yoho-core-b0-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Каталог трекеров для встроенного поиска
        run: python3 tool/build_tracker_catalog.py || true

      - name: Единый ключ подписи (из секрета репозитория — в коде его нет)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error title=Подпись::Нет секрета ANDROID_KEYSTORE_B64"; exit 1; fi
          mkdir -p tool/assets
          echo "$KEYSTORE_B64" | base64 -d > tool/assets/signing.keystore

      - name: Bundle verified intro for feature build
        if: ${{ inputs.ref == 'feature/intro-and-community-playlists' }}
        run: |
          set -euo pipefail
          mkdir -p native/app/src/main/assets
          curl -fsSL --retry 3 https://github.com/deepworks-soft/yo-ho/releases/download/intro-assets-v1/yoho-intro-v2.mp4 -o native/app/src/main/assets/yoho-intro-v2.mp4
          echo '6c6a2ea7d2f3c46bfd880601489b8bd40e7da5c7c254bb3cce02313afded4b02  native/app/src/main/assets/yoho-intro-v2.mp4' | sha256sum -c -

      - name: Сборка APK
        run: |
          set -o pipefail
          gradle -p native --no-daemon --stacktrace assembleRelease \
            -PyohoVersion=$VERSION -PyohoBuild=$BUILD -PyohoKeystore=$PWD/tool/assets/signing.keystore 2>&1 | tee build.log

      - name: Показать ошибку
        if: failure()
        run: |
          # Ошибки Kotlin — строки «e: …»; иначе последние строки журнала.
          E=$(grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -60)
          [ -z "$E" ] && E=$(tail -n 60 build.log)
          echo "::error title=Сборка::$(printf '%s' "$E" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"

      - name: Имена файлов и проверка подписи
        run: |
          set -e
          O=native/app/build/outputs/apk/release
          ls -la $O
          cp $O/app-universal-release.apk Yo-ho-$VERSION.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f $O/app-$abi-release.apk ] && cp $O/app-$abi-release.apk Yo-ho-$VERSION-$abi.apk
          done
          # Подписано тем же ключом, что Flutter-версия? Иначе ТВ не поставит обновление поверх.
          for f in Yo-ho-$VERSION*.apk; do python3 tool/check_apk_sign.py "$f" tool/assets/signing.keystore; done
          # Тот же пакет и номер сборки больше прежних.
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging Yo-ho-$VERSION.apk | head -1 | tee badging.txt
          grep -q "name='app.deepcinema.deep_cinema'" badging.txt || { echo "::error title=Пакет::не тот applicationId"; exit 1; }
          # Профиль прогрева (native/app/src/main/baseline-prof.txt) попал в APK — ТВ скомпилирует экраны заранее.
          if unzip -l Yo-ho-$VERSION.apk | grep -q 'assets/dexopt/baseline.prof'; then echo "::notice title=Профиль прогрева::assets/dexopt/baseline.prof есть"; else echo "::warning title=Профиль прогрева::нет assets/dexopt/baseline.prof в APK"; fi
          echo "::notice title=APK::$(ls -l Yo-ho-$VERSION*.apk | awk '{printf "%s %.1f МБ; ", $9, $5/1048576}') сборка $BUILD"

      - name: Verify both engines are packaged byte-for-byte
        if: ${{ (inputs.ref || 'experiment/yoho-core') == 'experiment/yoho-core' }}
        run: |
          set -euo pipefail
          APK="Yo-ho-$VERSION.apk"
          J=native/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for so in libtorrserver.so libyohocore.so; do
              unzip -p "$APK" "lib/$abi/$so" | cmp - "$J/$abi/$so"
              SPLIT="Yo-ho-$VERSION-$abi.apk"
              test -s "$SPLIT"
              unzip -p "$SPLIT" "lib/$abi/$so" | cmp - "$J/$abi/$so"
            done
          done

      - name: Файлы для ручной установки (без Диска)
        uses: actions/upload-artifact@v4
        with:
          name: files-native-${{ env.VERSION }}
          path: Yo-ho-${{ env.VERSION }}*.apk
          retention-days: 14

      - name: Убрать ключ подписи
        if: always()
        run: rm -f tool/assets/signing.keystore ks
