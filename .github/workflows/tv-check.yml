name: Проверка пульта (эмулятор)
# Запуск вручную. Собирает APK из выбранной ветки (с временной подписью — не для установки
# на ТВ), запускает на эмуляторе Android с экраном 1920×1080 и нажимает кнопки пульта
# по сценарию tool/tv_scenario.txt. Снимки — в ветку tv-shots. Релиз не создаёт.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка'
        default: main
permissions:
  contents: write
concurrency:
  group: tv-check
  cancel-in-progress: true
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # как у выпущенных сборок; 3.50 ломает сборку APK (lint на Java 17)
          cache: true
      - name: Сборка APK
        run: |
          set -o pipefail
          { flutter create . --project-name deep_cinema --org app.deepcinema --platforms=android && python3 tool/patch_platforms.py android; } > build.log 2>&1
          python3 tool/build_tracker_catalog.py >> build.log 2>&1 || true
          keytool -genkeypair -keystore tool/assets/signing.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=test" -keyalg RSA -validity 1000 >> build.log 2>&1
          flutter pub get >> build.log 2>&1
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error •" analyze.txt | head -30 | while read -r l; do echo "::error title=analyze::$l"; done || true
          flutter build apk --release --target-platform android-x64 --dart-define=APP_VERSION=9.9.9 --dart-define=DC_FOCUS_LOG=true --dart-define=DC_DEMO=true >> build.log 2>&1 || { echo "::error title=APK::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - name: Тестовое видео для плеера
        run: |
          sudo apt-get -qq update > /dev/null && sudo apt-get -qq install -y ffmpeg > /dev/null
          mkdir -p /tmp/dcvideo
          printf '1\n00:00:02,000 --> 00:01:50,000\nПроверка субтитров\n' > /tmp/dcvideo/subs.srt
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=24000/1001" -f lavfi -i "sine=frequency=440" -f lavfi -i "sine=frequency=880" -i /tmp/dcvideo/subs.srt \
            -t 120 -map 0 -map 1 -map 2 -map 3 -c:v libx264 -preset ultrafast -g 48 -c:a ac3 -ac 2 -c:s srt \
            -metadata:s:a:0 language=rus -metadata:s:a:0 title="Дубляж" -metadata:s:a:1 language=eng -metadata:s:a:1 title="Original" \
            -metadata:s:s:0 language=rus /tmp/dcvideo/test.mkv
          # Кадр 4:3 с кругом — проверка «Заполнить экран» (круг не должен стать овалом).
          ffmpeg -loglevel error -f lavfi -i "color=c=gray:s=640x480:r=25,geq=lum='if(lt(hypot(X-W/2\,Y-H/2)\,H/3)\,235\,40)':cb=128:cr=128" \
            -f lavfi -i "sine=frequency=330" -t 40 -map 0 -map 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/dcvideo/test43.mkv
          # Звук DTS и TrueHD (кто декодирует: программа (FFmpeg) или телевизор — видно в DCSTATS).
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=24000/1001" -f lavfi -i "sine=frequency=550" -t 40 -map 0 -map 1 \
            -c:v libx264 -preset ultrafast -c:a dca -strict -2 -ac 2 -ar 48000 /tmp/dcvideo/test-dts.mkv || echo "::warning::DTS не собрался"
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=24000/1001" -f lavfi -i "sine=frequency=660" -t 40 -map 0 -map 1 \
            -c:v libx264 -preset ultrafast -c:a truehd -strict -2 -ac 2 -ar 48000 /tmp/dcvideo/test-truehd.mkv || echo "::warning::TrueHD не собрался"
          # «Старый XviD-рип»: MPEG-4 + MP3 CBR «по байтам», в первом куске — полсекунды звука (как у VirtualDub).
          # На эмуляторе FFmpeg-декодера старых форматов нет (он только для ARM) — здесь проверяется время звука.
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=640x480:rate=25" -t 60 -c:v mpeg4 -vtag XVID -bf 0 -q:v 4 -an /tmp/xv-v.avi
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=44100" -t 60 -ac 2 -c:a libmp3lame -b:a 128k /tmp/xv-a.mp3
          python3 tool/make_test_avi.py /tmp/xv-v.avi /tmp/xv-a.mp3 /tmp/dcvideo/test-xvid.avi || echo "::warning::XviD не собрался"
          ls -la /tmp/dcvideo
      - name: KVM
        run: |
          # Эмулятору нужно место на диске: убираем то, что стенду не нужно (.NET, Haskell, CodeQL, Boost).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          df -h / | tail -1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          # Без аппаратной виртуализации эмулятор x86 не запустится — видно сразу в заметках.
          echo "::notice title=Машина::ядер $(nproc), память $(free -g | awk '/Mem/{print $2}') ГБ, /dev/kvm: $(ls -l /dev/kvm 2>&1 | cut -c1-60), vmx/svm: $(grep -cE 'vmx|svm' /proc/cpuinfo)"
      - name: Эмулятор и пульт
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # api 29 и экран 1280×720 — легче для 2 ядер закрытого репозитория (на 30/1920×1080 не стартовал).
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          # Машины закрытых репозиториев слабее (2 ядра, 7 ГБ): больше времени на запуск, скромнее память.
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -skin 1280x720 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: bash tool/tv_check.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Ошибки программы
        if: always()
        run: |
          grep -c DCFOCUS shots/flutter.log || true
          grep -iE "exception|error" shots/flutter.log | head -15 | while read -r l; do echo "::warning title=flutter::$(echo "$l" | cut -c1-300)"; done || true
          grep -cE "discontinuity" shots/native.log | while read -r l; do echo "::notice title=звук::разрывов времени звука: $l"; done || true
          grep -E "DCSTATS|DCCLIP|exo:|player error" shots/flutter.log | head -16 | while read -r l; do echo "::notice title=player::$(echo "$l" | cut -c1-400)"; done || true
          grep -iE "FATAL|crash|Exception" shots/native.log | head -10 | while read -r l; do echo "::warning title=native::$(echo "$l" | cut -c1-300)"; done || true
      - name: В ветку tv-shots
        if: always()
        run: |
          mkdir -p shots && cd shots
          [ -n "$(ls -A)" ] || { echo "::error title=Стенд::снимков нет — эмулятор не запустился"; echo "пусто" > EMPTY.txt; }
          which convert > /dev/null || sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
          for f in *.png; do [ -f "$f" ] && convert "$f" -resize 960x -quality 80 "${f%.png}.jpg" && rm "$f"; done || true
          git init -q
          git config user.name "deep-cinema-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b tv-shots
          git add -A
          git commit -qm "Пульт: ${{ inputs.ref }} $(date -u +%F\ %T)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tv-shots
