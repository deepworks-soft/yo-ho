name: Android TV beta publication
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT:
        required: false
  push:
    branches: [signed-build]
    paths: [beta-publish-request.json]

permissions:
  actions: read
  contents: write

concurrency:
  group: android-tv-beta-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/signed-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.request.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CALL_RUN_ID: ${{ inputs.run_id }}
      CALL_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate approved build and download its artifact
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CALL_RUN_ID" ]]; then
            RUN_ID="$CALL_RUN_ID"
            VERSION="$CALL_VERSION"
            [[ "$RUN_ID" == "$GITHUB_RUN_ID" ]]
          else
            RUN_ID=$(jq -er '.run_id | tostring' beta-publish-request.json)
            VERSION=$(jq -er '.version | strings' beta-publish-request.json)
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]
          export VERSION
          python3 -c 'import os; assert tuple(map(int,os.environ["VERSION"].split("."))) > (0,8,93)'
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.head_branch=="signed-build" and .head_repository.full_name==$repo and .path==".github/workflows/android-test.yml"' run.json >/dev/null
          if [[ -z "$CALL_RUN_ID" ]]; then
            jq -e '.status=="completed" and .conclusion=="success"' run.json >/dev/null
          fi
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "yoho-test-$VERSION" --dir out
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Independently verify signed APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile
          v = os.environ["VERSION"]
          p = pathlib.Path("out")
          name = f"Yo-ho-{v}.apk"
          assert {x.name for x in p.iterdir()} == {name, "manifest-beta.json"}
          m = json.loads((p / "manifest-beta.json").read_text())
          key = "EqFtZwl1Pijcsn8lhxOenM9mRvqAHnIfINZ8kEZ5eYM="
          assert m["app"] == "yo-ho" and m["version"] == v and m["key"] == key
          assert len(m["files"]) == 1
          f = m["files"][0]
          assert f["name"] == name and f["kind"] == "apk"
          data = (p / name).read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          assert len(data) == f["size"] and sha == f["sha256"]
          with tempfile.TemporaryDirectory() as tmp:
              t = pathlib.Path(tmp)
              (t/"pub.der").write_bytes(bytes.fromhex("302a300506032b6570032100") + base64.b64decode(key, validate=True))
              (t/"msg").write_bytes(f"yo-ho-update-v1\n{name}\n{sha}\n{v}".encode())
              (t/"sig").write_bytes(base64.b64decode(f["sig"], validate=True))
              subprocess.run(["openssl","pkeyutl","-verify","-pubin","-inkey",str(t/"pub.der"),"-keyform","DER","-rawin","-in",str(t/"msg"),"-sigfile",str(t/"sig")],check=True)
          print("Signed beta files verified")
          PY
      - name: Publish beta only, never stable
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK="Yo-ho-$VERSION.apk"
          STABLE=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          export STABLE
          python3 -c 'import os; assert tuple(map(int,os.environ["VERSION"].split("."))) > tuple(map(int,os.environ["STABLE"].removeprefix("v").split(".")))'
          # Refuse existing tags and releases, including drafts; never overwrite an update.
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release already exists; no changes made"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; no changes made"
            exit 1
          fi
          gh release create "$TAG" "out/$APK" out/manifest-beta.json --repo "$GH_REPO" --target main --title "Yo-ho $VERSION (test)" --notes "Test channel only. Not a stable update." --draft --prerelease --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,assets > release.json
          jq -e --arg apk "$APK" '.isDraft and .isPrerelease and ([.assets[].name]|sort)==([$apk,"manifest-beta.json"]|sort)' release.json >/dev/null
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$STABLE" ]]
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease | jq -e '(.isDraft|not) and .isPrerelease' >/dev/null
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$STABLE" ]]
          echo "Published beta $TAG; stable remains $STABLE"

  notify-owner:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/android-beta-notify.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
