name: Yo-ho — автоматический запуск тестовых сборок

# Читает только номер следующей тестовой версии из закрытой ветки native.
# Ничего не выпускает всем: запускает только build-native.yml с disk=yes.
# GitHub может задерживать выполнение cron; повторные сборки одной версии блокируются тегом.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: yoho-native-auto-build-request
  cancel-in-progress: false

jobs:
  start-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read owner-controlled build request and start beta build once
        shell: bash
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SRC_TOKEN:-}" ]; then
            echo '::error::SRC_TOKEN is not configured'
            exit 1
          fi
          # Этот секрет уже используется существующей сборкой для чтения закрытого исходного кода.
          B64="$(GH_TOKEN="$SRC_TOKEN" gh api \
            'repos/kozenkovnikitavladimirovich-max/deep-cinema/contents/native/build-request.json?ref=native' \
            --jq '.content')"
          REQUEST="$(printf '%s' "$B64" | tr -d '\n' | base64 -d)"
          VERSION="$(printf '%s' "$REQUEST" | jq -er '.version | strings')"
          NOTES="$(printf '%s' "$REQUEST" | jq -r '.notes // "Тестовые исправления Kotlin TV"' | head -c 220)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Incorrect test build version'
            exit 1
          fi
          # Отдельный неизменяемый тег отмечает уже обработанный запрос.
          if gh api "repos/$GH_REPO/git/ref/tags/native-test-request-$VERSION" >/dev/null 2>&1; then
            echo "Test build $VERSION already requested"
            exit 0
          fi
          # Два барьера против повторов: выпущенная версия и недавний/именной run.
          # Пометка GitHub tags иногда отвечает 403 для actions[bot].
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Beta $VERSION already has a GitHub prerelease"
            exit 0
          fi
          if gh run list --workflow build-native.yml --limit 30 --json displayTitle,createdAt,event,status |
            jq -e --arg v "$VERSION" '
              any(.[]; .event == "workflow_dispatch" and (
                (.displayTitle | contains($v)) or
                ((now - (.createdAt | fromdateiso8601) < 1200) and .status != "completed")
              ))
            ' >/dev/null; then
            echo "Native build already queued or running"
            exit 0
          fi
          # Запрашиваем сборку ровно один раз. Для новой версии будет run-name с номером.
          gh workflow run build-native.yml --ref main \
            -f "version=$VERSION" \
            -f 'ref=native' \
            -f 'disk=yes' \
            -f "notes=$NOTES"
          # Метка — дополнительная защита, но GitHub иногда запрещает её создавать.
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/native-test-request-$VERSION" \
            -f "sha=$GITHUB_SHA" >/dev/null 2>&1 || echo "::warning::GitHub denied request tag, run-name prevents duplicates"
          echo "Test build $VERSION dispatched once"
