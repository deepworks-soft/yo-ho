name: Yo-ho — автоматическая тестовая сборка

# Служебная задача GitHub от владельца -> только тестовая Kotlin TV сборка.
# Важное ограничение: этот workflow НЕ может выпустить версию всем.
on:
  issues:
    types: [opened]
  workflow_run:
    workflows: ["Сборка Yo-ho для ТВ (новая основа)"]
    types: [completed]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  start-test-build:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'kozenkovnikitavladimirovich-max' &&
      startsWith(github.event.issue.title, '[native-build] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check request and dispatch test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_TITLE: ${{ github.event.issue.title }}
          REQUEST_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REQUEST_TITLE#\[native-build\] }"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh issue comment "$REQUEST_NUMBER" --body "Отклонено: номер версии должен быть вида 0.8.16."
            exit 1
          fi
          # Этот workflow запускает ТОЛЬКО Kotlin-ветку native и ТОЛЬКО beta-манифест.
          gh workflow run build-native.yml --ref main \
            -f "version=$VERSION" \
            -f "ref=native" \
            -f "disk=yes" \
            -f "notes=Тестовая версия Yo-ho $VERSION (исправления Kotlin TV)"
          gh issue comment "$REQUEST_NUMBER" --body "Запрошена **тестовая** сборка Yo-ho $VERSION из ветки native. [Ход сборки](https://github.com/$GH_REPO/actions/workflows/build-native.yml). Публичный канал не затрагивается."

  notify-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failed build notification to owner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT:-}" ]; then
            echo 'Telegram notification skipped: repository secrets not configured'
            exit 0
          fi
          python3 - <<'PY' > message.json
          import json, os
          print(json.dumps({
              'chat_id': os.environ['TELEGRAM_CHAT'],
              'text': '❌ Тестовая сборка Yo-ho для ТВ завершилась с ошибкой.\n' + os.environ['RUN_URL']
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --max-time 15 \
            --header 'Content-Type: application/json' \
            --data-binary @message.json \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" > /dev/null
