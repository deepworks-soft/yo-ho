name: Сборка Yo-ho

# Запуск вручную: notes — что нового. Код — закрытый kozenkovnikitavladimirovich-max/deep-cinema (секрет SRC_TOKEN,
# только чтение); этот публичный репозиторий — только сборка. Журналы и артефакты публичны: секреты не печатаются,
# ключ расшифровки журналов вылетов кладётся в закрытую папку Диска (disk:/Yo-ho-symbols), не в артефакты. Выпуск — только на Яндекс Диск
# аккаунта Deepworks Soft (публичная папка Keys.diskPublic): каждая часть сборки (ТВ, ПК) подписывает
# свои файлы (tool/update_sign.py, ключ выводится из ключа подписи APK) и кладёт их на Диск; последняя
# собирает manifest.json и выкладывает его последним. Между частями — только маленькие списки подписей.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Что нового'
        default: 'Обновление Yo-ho'
      ref:
        description: 'Ветка кода'
        default: main
      channel:
        description: 'Канал: test — сначала владельцу (manifest-beta.json), all — сразу всем'
        default: test
      disk:
        description: 'Выкладывать на Яндекс Диск (no — только файлы в артефакты сборки, для ручной установки)'
        default: 'yes'
      version:
        description: 'Номер версии, например 0.6.9'
        required: true

permissions:
  contents: write   # выпуск GitHub — запасной путь на Диск, если прямая загрузка закрыта лимитом

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: Android TV (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Номер версии
        shell: bash
        env:
          V: ${{ inputs.version }}
        run: |
          # Версию задают при запуске. Номер сборки Android должен только расти (иначе ТВ: «Приложение не
          # установлено»): в закрытом репозитории последней была 1091 (0.6.8 тестовая) — здесь 1100 + номер запуска.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error title=Версия::неверный номер версии"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(( 1100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # как у выпущенных сборок; 3.50 ломает сборку APK (lint на Java 17)
          cache: true

      - name: Платформенные файлы
        run: |
          set -o pipefail
          { flutter create . --project-name deep_cinema --org app.deepcinema --platforms=android && python3 tool/patch_platforms.py android; } 2>&1 | tee -a build.log

      - name: Торрент-движок для Android (TorrServer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/YouROK/TorrServer/releases/latest > ts.json
          pick() { jq -r --arg re "$1" '[.assets[] | select(.name|test($re;"i"))][0].browser_download_url // empty' ts.json; }
          A64=$(pick 'android.*arm64'); A7=$(pick 'android.*arm(v)?7')
          echo "arm64: $A64"; echo "arm7: $A7"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          [ -n "$A64" ] && curl -fsSL "$A64" -o android/app/src/main/jniLibs/arm64-v8a/libtorrserver.so
          [ -n "$A7" ] && curl -fsSL "$A7" -o android/app/src/main/jniLibs/armeabi-v7a/libtorrserver.so
          ls -la android/app/src/main/jniLibs/*/ || true
          if [ -z "$A64" ]; then echo "::warning::TorrServer для Android не скачан — сборка без встроенного движка"; fi
          exit 0

      - name: Каталог трекеров для встроенного поиска
        run: python3 tool/build_tracker_catalog.py || true

      - name: Зависимости и проверка кода
        run: |
          set -o pipefail
          { flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings; } 2>&1 | tee -a build.log | tee analyze.txt
          # Предупреждения анализатора — в аннотацию, чтобы их было видно без логов.
          W=$(grep -E "(warning|error) •" analyze.txt | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' || true)
          if [ -n "$W" ]; then echo "::warning title=Анализатор::$W"; fi

      - name: Единый ключ подписи (из секрета репозитория — в коде его нет)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error title=Подпись::Нет секрета ANDROID_KEYSTORE_B64 (Settings → Secrets and variables → Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > tool/assets/signing.keystore

      - name: Сборка APK
        run: |
          set -o pipefail
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-name=$VERSION --build-number=$BUILD --dart-define=APP_VERSION=$VERSION 2>&1 | tee -a build.log

      - name: Ключ расшифровки журналов (Android) — в закрытую папку Диска
        continue-on-error: true
        shell: bash
        env:
          T: ${{ secrets.YADISK_TOKEN }}
        run: |
          # Не в артефакты: они в публичном репозитории видны всем, а этот файл снимает обфускацию.
          # Расшифровка: flutter symbolize -i журнал.txt -d app.android-arm64.symbols
          7z a -bso0 -bsp0 symbols-android-$VERSION.zip ./build/symbols/* > /dev/null
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho-symbols")" || true
          href=$(curl -s -H "$A" "$API/upload?path=$(enc "disk:/Yo-ho-symbols/symbols-android-$VERSION.zip")&overwrite=true" | python3 -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 900 -T symbols-android-$VERSION.zip "$href" || true)
          case "$code" in 20[012]) echo "::notice title=Ключ расшифровки::disk:/Yo-ho-symbols/symbols-android-$VERSION.zip"; rm -f symbols-android-$VERSION.zip;; *) echo "::warning title=Ключ расшифровки::на Диск не загрузился ($code) — в артефакт, зашифрованным";; esac

      - name: Ключ расшифровки — зашифрованным в артефакт (если Диск не принял)
        if: ${{ hashFiles('symbols-android-*.zip') != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Пароль выводится из секрета ключа подписи (в журнал не попадает); расшифровать — только сборкой с этим секретом.
          P=$(printf %s "$KEYSTORE_B64" | sha256sum | cut -c1-40)
          7z a -bso0 -bsp0 -mhe=on -p"$P" symbols-android-$VERSION.7z symbols-android-$VERSION.zip > /dev/null
          rm -f symbols-android-$VERSION.zip
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('symbols-android-*.7z') != '' }}
        with:
          name: symbols-android-encrypted
          path: symbols-android-*.7z
          retention-days: 90
      - name: Ключ расшифровки (Android) — зашифрованным на Диск через GitHub (если напрямую не принял)
        if: ${{ hashFiles('symbols-android-*.7z') != '' }}
        continue-on-error: true
        shell: bash
        env:
          T: ${{ secrets.YADISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.7.6: Диск часто не даёт прямую загрузку (лимит). Зашифрованный архив (пароль — из секрета подписи)
          # ненадолго кладётся в выпуск GitHub, Диск скачивает его по ссылке в disk:/Yo-ho-symbols, файл из выпуска удаляется.
          f=$(ls symbols-android-*.7z | head -n1)
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
              --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
          ok=""
          for i in 1 2 3; do gh release upload "v$VERSION" "$f" --clobber -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && { ok=1; break; }; sleep 10; done
          [ -z "$ok" ] && { echo "::warning title=Ключ расшифровки::в выпуск не загрузился — остаётся в артефакте"; exit 0; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$f"
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho-symbols")" || true
          done=""
          op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "disk:/Yo-ho-symbols/$f")&url=$(enc "$url")" | python3 -c "import json,sys;print(json.load(sys.stdin).get('href',''))" 2>/dev/null || true)
          if [ -n "$op" ]; then
            for k in $(seq 1 90); do
              st=$(curl -s -H "$A" "$op" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
              [ "$st" = success ] && { done=1; break; }
              [ "$st" = failed ] && break
              sleep 10
            done
          fi
          gh release delete-asset "v$VERSION" "$f" -y -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true
          if [ -n "$done" ]; then echo "::notice title=Ключ расшифровки::disk:/Yo-ho-symbols/$f (зашифрован)"; else echo "::warning title=Ключ расшифровки::Диск не скачал — остаётся в артефакте (90 дней)"; fi

      - name: Переименование
        run: cp build/app/outputs/flutter-apk/app-release.apk Yo-ho-$VERSION.apk

      - name: Проверка подписи (обновления должны вставать поверх)
        run: python3 tool/check_apk_sign.py Yo-ho-$VERSION.apk tool/assets/signing.keystore

      - name: Лёгкие APK под процессор (из универсального, тот же ключ и номер сборки)
        run: |
          set -e
          # Не --split-per-abi: он меняет номер сборки по процессору (2000+N), и универсальный APK потом
          # не встал бы поверх. Берём готовый универсальный, убираем чужие библиотеки и подписываем заново.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          unzip -Z1 Yo-ho-$VERSION.apk | grep '^lib/' | cut -d/ -f2 | sort -u > abis.txt
          echo "в универсальном: $(tr '\n' ' ' < abis.txt)"
          for abi in arm64-v8a armeabi-v7a; do
            grep -qx "$abi" abis.txt || { echo "::warning::нет библиотек $abi — лёгкий APK не делаю"; continue; }
            cp Yo-ho-$VERSION.apk t.apk
            for other in $(grep -vx "$abi" abis.txt); do zip -q -d t.apk "lib/$other/*"; done
            zip -q -d t.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
            "$BT/zipalign" -f -p 4 t.apk a.apk
            "$BT/apksigner" sign --ks tool/assets/signing.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out Yo-ho-$VERSION-$abi.apk a.apk
            "$BT/apksigner" verify Yo-ho-$VERSION-$abi.apk
            python3 tool/check_apk_sign.py Yo-ho-$VERSION-$abi.apk tool/assets/signing.keystore
            rm -f t.apk a.apk
          done
          ls -la Yo-ho-$VERSION*.apk
          echo "::notice title=APK::$(ls -l Yo-ho-$VERSION*.apk | awk '{printf "%s %.0f МБ; ", $9, $5/1048576}')"

      - name: Показать ошибку
        if: failure()
        run: echo "::error title=Android::$(tail -n 60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"

      - name: Файлы для ручной установки (без Диска)
        if: ${{ inputs.disk == 'no' }}
        uses: actions/upload-artifact@v4
        with:
          name: files-android-${{ env.VERSION }}
          path: Yo-ho-${{ env.VERSION }}*.apk
          retention-days: 14

      - name: Подпись и Яндекс Диск
        if: ${{ inputs.disk != 'no' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          T: ${{ secrets.YADISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PY: python3
        run: |
          set -e
          pip install -q cryptography
          python3 tool/update_sign.py sign-files tool/assets/signing.keystore "$VERSION" part-android.json Yo-ho-$VERSION*.apk
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          up() { # файл → путь на Диске. Сначала напрямую; если Яндекс не даёт ссылку (лимит загрузки
                 # DiskUploadTrafficLimitExceeded) — файл идёт в выпуск GitHub v$VERSION, а Диск сам скачивает его по ссылке.
                 # Имя файла = имя на Диске. Сервера загрузки Диска бывают медленными: < 1 МБ/с дольше минуты — заново.
            for i in 1 2 3 4 5 6; do
              lim="--speed-limit 1000000 --speed-time 60"; [ $i = 6 ] && lim=""
              href=$(curl -s -H "$A" "$API/upload?path=$(enc "$2")&overwrite=true" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              [ -z "$href" ] && break
              code=$(curl -s -o /dev/null -w '%{http_code}' $lim --max-time 3600 -T "$1" "$href" || true)
              case "$code" in 200|201|202) echo "$(basename "$1"): загружен"; return 0;; esac
              echo "$(basename "$1"): попытка $i не удалась ($code)"; sleep 5
            done
            echo "$(basename "$1"): напрямую Диск не принимает — через выпуск GitHub"
            gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
                --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
            for i in 1 2 3; do gh release upload "v$VERSION" "$1" --clobber -R "$GITHUB_REPOSITORY" && break; sleep 10; done
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$1")"
            for i in 1 2 3; do
              curl -s -o /dev/null -X DELETE -H "$A" "$API?path=$(enc "$2")&permanently=true" || true
              sleep 3
              op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "$2")&url=$(enc "$url")" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              if [ -n "$op" ]; then
                for k in $(seq 1 360); do
                  st=$(curl -s -H "$A" "$op" | $PY -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
                  [ "$st" = success ] && { echo "$(basename "$1"): Диск скачал с GitHub"; return 0; }
                  [ "$st" = failed ] && break
                  sleep 10
                done
              fi
              echo "$(basename "$1"): Диск не скачал по ссылке (попытка $i)"; sleep 15
            done
            echo "::error title=Яндекс Диск::Не загрузился $(basename "$1")"; return 1
          }
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho")" || true
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho/$VERSION")" || true
          for f in Yo-ho-$VERSION*.apk; do up "$f" "disk:/Yo-ho/$VERSION/$f"; done

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.disk != 'no' }}
        with:
          name: part-android
          path: part-android.json
          retention-days: 1

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Номер версии
        shell: bash
        env:
          V: ${{ inputs.version }}
        run: |
          # Версию задают при запуске. Номер сборки Android должен только расти (иначе ТВ: «Приложение не
          # установлено»): в закрытом репозитории последней была 1091 (0.6.8 тестовая) — здесь 1100 + номер запуска.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error title=Версия::неверный номер версии"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(( 1100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # как у выпущенных сборок; 3.50 ломает сборку APK (lint на Java 17)
          cache: true

      - name: Платформенные файлы
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          { flutter create . --project-name deep_cinema --org app.deepcinema --platforms=windows && python tool/patch_platforms.py windows; } 2>&1 | tee -a build.log

      - name: Каталог трекеров для встроенного поиска
        shell: bash
        run: python tool/build_tracker_catalog.py || true

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          { flutter pub get && flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=$VERSION --build-number=$BUILD --dart-define=APP_VERSION=$VERSION; } 2>&1 | tee -a build.log

      - name: Ключ расшифровки журналов (Windows) — в закрытую папку Диска
        continue-on-error: true
        shell: bash
        env:
          T: ${{ secrets.YADISK_TOKEN }}
        run: |
          # Не в артефакты: они в публичном репозитории видны всем, а этот файл снимает обфускацию.
          # Расшифровка: flutter symbolize -i журнал.txt -d app.android-arm64.symbols
          7z a -bso0 -bsp0 symbols-windows-$VERSION.zip ./build/symbols/* > /dev/null
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho-symbols")" || true
          href=$(curl -s -H "$A" "$API/upload?path=$(enc "disk:/Yo-ho-symbols/symbols-windows-$VERSION.zip")&overwrite=true" | python -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 900 -T symbols-windows-$VERSION.zip "$href" || true)
          case "$code" in 20[012]) echo "::notice title=Ключ расшифровки::disk:/Yo-ho-symbols/symbols-windows-$VERSION.zip"; rm -f symbols-windows-$VERSION.zip;; *) echo "::warning title=Ключ расшифровки::на Диск не загрузился ($code) — в артефакт, зашифрованным";; esac

      - name: Ключ расшифровки — зашифрованным в артефакт (если Диск не принял)
        if: ${{ hashFiles('symbols-windows-*.zip') != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Пароль выводится из секрета ключа подписи (в журнал не попадает); расшифровать — только сборкой с этим секретом.
          P=$(printf %s "$KEYSTORE_B64" | sha256sum | cut -c1-40)
          7z a -bso0 -bsp0 -mhe=on -p"$P" symbols-windows-$VERSION.7z symbols-windows-$VERSION.zip > /dev/null
          rm -f symbols-windows-$VERSION.zip
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('symbols-windows-*.7z') != '' }}
        with:
          name: symbols-windows-encrypted
          path: symbols-windows-*.7z
          retention-days: 90
      - name: Ключ расшифровки (Windows) — зашифрованным на Диск через GitHub (если напрямую не принял)
        if: ${{ hashFiles('symbols-windows-*.7z') != '' }}
        continue-on-error: true
        shell: bash
        env:
          T: ${{ secrets.YADISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.7.6: Диск часто не даёт прямую загрузку (лимит). Зашифрованный архив (пароль — из секрета подписи)
          # ненадолго кладётся в выпуск GitHub, Диск скачивает его по ссылке в disk:/Yo-ho-symbols, файл из выпуска удаляется.
          f=$(ls symbols-windows-*.7z | head -n1)
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
              --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
          ok=""
          for i in 1 2 3; do gh release upload "v$VERSION" "$f" --clobber -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && { ok=1; break; }; sleep 10; done
          [ -z "$ok" ] && { echo "::warning title=Ключ расшифровки::в выпуск не загрузился — остаётся в артефакте"; exit 0; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$f"
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho-symbols")" || true
          done=""
          op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "disk:/Yo-ho-symbols/$f")&url=$(enc "$url")" | python -c "import json,sys;print(json.load(sys.stdin).get('href',''))" 2>/dev/null || true)
          if [ -n "$op" ]; then
            for k in $(seq 1 90); do
              st=$(curl -s -H "$A" "$op" | python -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
              [ "$st" = success ] && { done=1; break; }
              [ "$st" = failed ] && break
              sleep 10
            done
          fi
          gh release delete-asset "v$VERSION" "$f" -y -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || true
          if [ -n "$done" ]; then echo "::notice title=Ключ расшифровки::disk:/Yo-ho-symbols/$f (зашифрован)"; else echo "::warning title=Ключ расшифровки::Диск не скачал — остаётся в артефакте (90 дней)"; fi

      - name: Торрент-движок для Windows (TorrServer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/YouROK/TorrServer/releases/latest > ts.json
          URL=$(jq -r '[.assets[] | select(.name|test("windows.*(amd64|x64).*\\.exe$";"i"))][0].browser_download_url // empty' ts.json)
          echo "windows: $URL"
          [ -n "$URL" ] && curl -fsSL "$URL" -o torrserver.exe
          if [ ! -f torrserver.exe ]; then echo "::warning::TorrServer для Windows не скачан"; fi
          exit 0

      - name: Агрегатор раздач для Windows (Jackett)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/Jackett/Jackett/releases/latest > jk.json
          URL=$(jq -r '[.assets[] | select(.name=="Jackett.Binaries.Windows.zip")][0].browser_download_url // empty' jk.json)
          echo "jackett: $URL"
          [ -n "$URL" ] && curl -fsSL "$URL" -o jackett.zip && 7z x -y -ojk jackett.zip > /dev/null
          if [ ! -f jk/Jackett/JackettConsole.exe ]; then echo "::warning::Jackett для Windows не скачан"; fi
          exit 0

      - name: Помощник для трекеров с проверкой «вы не робот» (FlareSolverr)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/FlareSolverr/FlareSolverr/releases/latest > fs.json
          URL=$(jq -r '[.assets[] | select(.name|test("windows.*x64.*\\.zip$";"i"))][0].browser_download_url // empty' fs.json)
          echo "flaresolverr: $URL"
          [ -n "$URL" ] && curl -fsSL "$URL" -o fs.zip && 7z x -y -ofs fs.zip > /dev/null
          F=$(find fs -iname flaresolverr.exe | head -1)
          if [ -z "$F" ]; then echo "::warning::FlareSolverr для Windows не скачан"; exit 0; fi
          mv "$(dirname "$F")" flaresolverr_dir
          echo "flaresolverr-$(jq -r .tag_name fs.json)" > helper.txt
          exit 0

      - name: Упаковка
        shell: pwsh
        run: |
          $out = "YoHo"
          Copy-Item -Recurse build/windows/x64/runner/Release $out
          Rename-Item "$out/deep_cinema.exe" "Yo-ho.exe"
          # С 0.6.1 помощники — в подпапке runtime (рядом с Yo-ho.exe только то, что нужно Windows для запуска).
          New-Item -ItemType Directory -Force "$out/runtime" | Out-Null
          if (Test-Path torrserver.exe) { Copy-Item torrserver.exe "$out/runtime/yoho-engine.exe" }
          if (Test-Path jk/Jackett) { Copy-Item -Recurse jk/Jackett "$out/runtime/search" }
          if (Test-Path flaresolverr_dir) { Copy-Item -Recurse flaresolverr_dir "$out/runtime/helper" }
          # Свои трекеры (файлы настроек Jackett), если положены в presets/jackett/Indexers.
          if (Test-Path presets/jackett/Indexers) {
            New-Item -ItemType Directory -Force "$out/runtime/search-preset" | Out-Null
            Copy-Item -Recurse presets/jackett/Indexers "$out/runtime/search-preset/Indexers"
          }
          # Версии тяжёлых компонентов: если они не менялись, обновление скачивает только саму программу.
          $ts = if (Test-Path ts.json) { (Get-Content ts.json -Raw | ConvertFrom-Json).tag_name } else { '-' }
          $jk = if (Test-Path jk.json) { (Get-Content jk.json -Raw | ConvertFrom-Json).tag_name } else { '-' }
          $hp = if (Test-Path helper.txt) { (Get-Content helper.txt -Raw).Trim() } else { '-' }
          # layout=runtime: раскладка папки поменялась — первое обновление на неё полное (с компонентами).
          "torrserver=$ts`njackett=$jk`nhelper=$hp`nlayout=runtime" | Set-Content -Encoding utf8 "$out/components.txt"
          Copy-Item "$out/components.txt" "Yo-ho-components.txt"

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Свежая версия — для тёмного оформления мастера установки.
          choco upgrade innosetup -y --no-progress | Out-Null
          $o = & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=..\YoHo" installer\yoho.iss 2>&1
          if ($LASTEXITCODE -ne 0) {
            $msg = ($o | Select-Object -Last 15) -join ' | '
            Write-Output "::error title=Установщик::$msg"
            exit 1
          }
          # Лёгкое обновление: только программа (без торрент-движка, агрегатора и помощника).
          $o = & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=..\YoHo" "/DLite=1" installer\yoho.iss 2>&1
          if ($LASTEXITCODE -ne 0) {
            $msg = ($o | Select-Object -Last 15) -join ' | '
            Write-Output "::error title=Лёгкое обновление::$msg"
            exit 1
          }
          Copy-Item dist\Yo-ho-Setup-*.exe .
          Copy-Item dist\Yo-ho-Update-*.exe .
          Get-ChildItem Yo-ho-Setup-*.exe, Yo-ho-Update-*.exe

      - name: Показать ошибку
        if: failure()
        shell: bash
        run: echo "::error title=Windows::$(tail -n 60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"

      - name: Файлы для ручной установки (без Диска)
        if: ${{ inputs.disk == 'no' }}
        uses: actions/upload-artifact@v4
        with:
          name: files-windows-${{ env.VERSION }}
          path: |
            Yo-ho-Update-*.exe
            Yo-ho-Setup-*.exe
          retention-days: 14

      - name: Подпись и Яндекс Диск
        if: ${{ inputs.disk != 'no' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          T: ${{ secrets.YADISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PY: python
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python -m pip install -q cryptography
          echo "$KEYSTORE_B64" | base64 -d > ks
          python tool/update_sign.py sign-files ks "$VERSION" part-windows.json Yo-ho-Setup-$VERSION.exe Yo-ho-Update-$VERSION.exe
          rm -f ks
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          up() { # файл → путь на Диске. Сначала напрямую; если Яндекс не даёт ссылку (лимит загрузки
                 # DiskUploadTrafficLimitExceeded) — файл идёт в выпуск GitHub v$VERSION, а Диск сам скачивает его по ссылке.
                 # Имя файла = имя на Диске. Сервера загрузки Диска бывают медленными: < 1 МБ/с дольше минуты — заново.
            for i in 1 2 3 4 5 6; do
              lim="--speed-limit 1000000 --speed-time 60"; [ $i = 6 ] && lim=""
              href=$(curl -s -H "$A" "$API/upload?path=$(enc "$2")&overwrite=true" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              [ -z "$href" ] && break
              code=$(curl -s -o /dev/null -w '%{http_code}' $lim --max-time 3600 -T "$1" "$href" || true)
              case "$code" in 200|201|202) echo "$(basename "$1"): загружен"; return 0;; esac
              echo "$(basename "$1"): попытка $i не удалась ($code)"; sleep 5
            done
            echo "$(basename "$1"): напрямую Диск не принимает — через выпуск GitHub"
            gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
                --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
            for i in 1 2 3; do gh release upload "v$VERSION" "$1" --clobber -R "$GITHUB_REPOSITORY" && break; sleep 10; done
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$1")"
            for i in 1 2 3; do
              curl -s -o /dev/null -X DELETE -H "$A" "$API?path=$(enc "$2")&permanently=true" || true
              sleep 3
              op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "$2")&url=$(enc "$url")" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              if [ -n "$op" ]; then
                for k in $(seq 1 360); do
                  st=$(curl -s -H "$A" "$op" | $PY -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
                  [ "$st" = success ] && { echo "$(basename "$1"): Диск скачал с GitHub"; return 0; }
                  [ "$st" = failed ] && break
                  sleep 10
                done
              fi
              echo "$(basename "$1"): Диск не скачал по ссылке (попытка $i)"; sleep 15
            done
            echo "::error title=Яндекс Диск::Не загрузился $(basename "$1")"; return 1
          }
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho")" || true
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho/$VERSION")" || true
          up Yo-ho-Update-$VERSION.exe "disk:/Yo-ho/$VERSION/Yo-ho-Update-$VERSION.exe"
          up Yo-ho-Setup-$VERSION.exe "disk:/Yo-ho/$VERSION/Yo-ho-Setup-$VERSION.exe"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.disk != 'no' }}
        with:
          name: part-windows
          path: |
            part-windows.json
            Yo-ho-components.txt
          retention-days: 1

  publish:
    name: Выпуск на Яндекс Диск
    needs: [android, windows]
    if: ${{ inputs.disk != 'no' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Код — в закрытом репозитории; токен только на чтение, в .git не сохраняется.
          repository: kozenkovnikitavladimirovich-max/deep-cinema
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Номер версии
        env:
          V: ${{ inputs.version }}
        run: echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          merge-multiple: true

      - name: manifest.json — последним
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          T: ${{ secrets.YADISK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PY: python3
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          pip install -q cryptography
          echo "$KEYSTORE_B64" | base64 -d > ks
          printf '%s\n' "$NOTES" > notes.txt
          python3 tool/update_sign.py merge ks "$VERSION" notes.txt manifest.json parts/Yo-ho-components.txt -- parts/part-android.json parts/part-windows.json
          rm -f ks
          grep -q "\"version\": \"$VERSION\"" manifest.json
          want=$(grep -o "updatePublicKey = '[^']*'" lib/core/keys.dart | cut -d"'" -f2)
          got=$(python3 -c "import json;print(json.load(open('manifest.json'))['key'])")
          [ "$got" = "$want" ] || { echo "::error title=Подпись::ключ сборки не совпадает с ключом в программе"; exit 1; }
          A="Authorization: OAuth $T"
          API=https://cloud-api.yandex.net/v1/disk/resources
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          up() { # файл → путь на Диске. Сначала напрямую; если Яндекс не даёт ссылку (лимит загрузки
                 # DiskUploadTrafficLimitExceeded) — файл идёт в выпуск GitHub v$VERSION, а Диск сам скачивает его по ссылке.
                 # Имя файла = имя на Диске. Сервера загрузки Диска бывают медленными: < 1 МБ/с дольше минуты — заново.
            for i in 1 2 3 4 5 6; do
              lim="--speed-limit 1000000 --speed-time 60"; [ $i = 6 ] && lim=""
              href=$(curl -s -H "$A" "$API/upload?path=$(enc "$2")&overwrite=true" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              [ -z "$href" ] && break
              code=$(curl -s -o /dev/null -w '%{http_code}' $lim --max-time 3600 -T "$1" "$href" || true)
              case "$code" in 200|201|202) echo "$(basename "$1"): загружен"; return 0;; esac
              echo "$(basename "$1"): попытка $i не удалась ($code)"; sleep 5
            done
            echo "$(basename "$1"): напрямую Диск не принимает — через выпуск GitHub"
            gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target main --prerelease --title "Yo-ho $VERSION" \
                --notes "Файлы Yo-ho $VERSION. Устанавливать удобнее с сайта: https://deepworks-soft.github.io" > /dev/null 2>&1 || true
            for i in 1 2 3; do gh release upload "v$VERSION" "$1" --clobber -R "$GITHUB_REPOSITORY" && break; sleep 10; done
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$(basename "$1")"
            for i in 1 2 3; do
              curl -s -o /dev/null -X DELETE -H "$A" "$API?path=$(enc "$2")&permanently=true" || true
              sleep 3
              op=$(curl -s -X POST -H "$A" "$API/upload?path=$(enc "$2")&url=$(enc "$url")" | $PY -c "import json,sys;print(json.load(sys.stdin).get('href',''))")
              if [ -n "$op" ]; then
                for k in $(seq 1 360); do
                  st=$(curl -s -H "$A" "$op" | $PY -c "import json,sys;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
                  [ "$st" = success ] && { echo "$(basename "$1"): Диск скачал с GitHub"; return 0; }
                  [ "$st" = failed ] && break
                  sleep 10
                done
              fi
              echo "$(basename "$1"): Диск не скачал по ссылке (попытка $i)"; sleep 15
            done
            echo "::error title=Яндекс Диск::Не загрузился $(basename "$1")"; return 1
          }
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho")" || true
          curl -s -o /dev/null -X PUT -H "$A" "$API?path=$(enc "disk:/Yo-ho/$VERSION")" || true
          # Все файлы версии на месте и совпадают по размеру?
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.parse
          m = json.load(open('manifest.json'))
          A = 'Authorization: OAuth ' + os.environ['T']
          bad = 0
          for f in m['files']:
              p = urllib.parse.quote(f"disk:/Yo-ho/{m['version']}/{f['name']}", safe='')
              r = subprocess.run(['curl', '-s', '-H', A, f'https://cloud-api.yandex.net/v1/disk/resources?path={p}&fields=size'], capture_output=True, text=True).stdout
              size = json.loads(r or '{}').get('size')
              if size != f['size']:
                  bad += 1
                  print(f"::error title=Яндекс Диск::{f['name']}: на Диске {size}, должно быть {f['size']}")
          sys.exit(1 if bad else 0)
          PY
          # Тестовый канал: версия сначала у владельца («Тестовые версии» в программе). Всем — запуском
          # «Выпустить для всех» (promote.yml): он копирует manifest-beta.json в manifest.json без пересборки.
          cp manifest.json manifest-beta.json
          up manifest-beta.json "disk:/Yo-ho/manifest-beta.json"
          if [ "${{ inputs.channel }}" = "all" ]; then up manifest.json "disk:/Yo-ho/manifest.json"; bash tool/disk_current.sh "$VERSION"; fi
          # Какая версия сейчас у всех (основной канал) — её папку не трогаем, даже если она старая.
          MAIN=$(curl -s -L "$(curl -s -H "$A" "$API/download?path=$(enc "disk:/Yo-ho/manifest.json")" | python3 -c "import json,sys;print(json.load(sys.stdin).get('href',''))")" | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
          echo "основной канал: ${MAIN:-нет}"
          # Старые версии: оставляем три последние (насовсем, мимо корзины — место 5 ГБ).
          curl -s -H "$A" "$API?path=$(enc "disk:/Yo-ho")&limit=200&fields=_embedded.items.name,_embedded.items.type" > list.json
          MAIN="$MAIN" python3 - > old.txt <<'PY'
          import json, os, re
          items = json.load(open('list.json')).get('_embedded', {}).get('items', [])
          vers = [i['name'] for i in items if i.get('type') == 'dir' and re.fullmatch(r'\d+(\.\d+)*', i['name'])]
          vers.sort(key=lambda v: [int(x) for x in v.split('.')])
          print('\n'.join(v for v in vers[:-3] if v != os.environ.get('MAIN')))
          PY
          while read -r v; do
            [ -n "$v" ] && curl -s -o /dev/null -X DELETE -H "$A" "$API?path=$(enc "disk:/Yo-ho/$v")&permanently=true" && echo "удалена $v"
          done < old.txt
          if [ "${{ inputs.channel }}" = "all" ]; then
            echo "::notice title=Выпуск::Yo-ho $VERSION — у всех"
          else
            echo "::notice title=Выпуск::Yo-ho $VERSION — в тестовом канале (у владельца). Всем — запуск «Выпустить для всех»."
          fi
      - name: Владельцу в Telegram — тестовая версия готова
        if: ${{ inputs.channel != 'all' }}
        continue-on-error: true
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Кнопка «Выпустить для всех» работает через бота (мост, секрет GH_TOKEN); без него бот подскажет.
          [ -z "$TG" ] || [ -z "$CHAT" ] && exit 0
          python3 - <<'PY' > tg.json
          import json, os
          v = os.environ.get('VERSION', '')
          text = f"🧪 Тестовая Yo-ho {v} готова — придёт обновлением на ваши устройства (или скачайте: deepworks-soft.github.io/tv?v={v}).\n{os.environ.get('NOTES', '')}".strip()
          print(json.dumps({"chat_id": os.environ['CHAT'], "text": text, "reply_markup": {"inline_keyboard": [[{"text": f"🚀 Выпустить {v} для всех", "callback_data": f"promote:{v}"}]]}}, ensure_ascii=False))
          PY
          curl -s -o /dev/null -H 'content-type: application/json' --data @tg.json "https://api.telegram.org/bot$TG/sendMessage" || true
