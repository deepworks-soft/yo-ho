name: Yo-ho — Cloudflare test Worker
on:
  push:
    branches: [automation/worker-test]
    paths:
      - '.github/workflows/worker-test-deploy.yml'
      - 'tool/bridge/deploy-test-request.json'
permissions:
  contents: read
concurrency:
  group: yoho-cloudflare-test
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.request.outputs.source }}
      mode: ${{ steps.request.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=tool/bridge/deploy-test-request.json
          source=$(jq -er '.source' "$file")
          mode=$(jq -er '.mode' "$file")
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          [[ "$mode" == check || "$mode" == deploy ]]
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.request.outputs.mode == 'deploy'
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ steps.request.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.request.outputs.mode == 'deploy'
        with:
          node-version: '24'
      - name: Run Worker tests
        if: steps.request.outputs.mode == 'deploy'
        working-directory: source/tool/bridge
        run: |
          set -euo pipefail
          cp worker.js worker.mjs
          node --check worker.mjs > "$RUNNER_TEMP/worker-test.log" 2>&1 || { echo '::error::Worker syntax check failed'; exit 1; }
          for suite in identity external migration club social keys community chunks curated watch playlists; do
            node "${suite}_test.mjs" > "$RUNNER_TEMP/worker-test.log" 2>&1 || { echo "::error::Failed suite: $suite"; exit 1; }
            echo "OK $suite"
          done
  cloudflare:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.validate.outputs.mode == 'deploy'
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ needs.validate.outputs.source }}
          persist-credentials: false
      - name: Verify connection and optionally deploy code only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ needs.validate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CF_TOKEN" && "$CF_ACCOUNT" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Missing or invalid Cloudflare secret"; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts"
          target="$base/deep-cinema-test"
          api() {
            local out="$1"; shift
            local http
            http=$(curl --silent --show-error --max-time 45 --output "$out" --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$@") || { echo "::error::Cloudflare network request failed"; return 1; }
            if [[ "$http" != 2* ]] || ! jq -e '.success == true' "$out" >/dev/null; then
              echo "::error::Cloudflare HTTP $http; API codes: $(jq -r '[.errors[]?.code] | join(",")' "$out" 2>/dev/null || true)"
              return 1
            fi
          }
          api "$tmp/test.json" "$target/settings"
          jq -e '.result.bindings | type == "array"' "$tmp/test.json" >/dev/null
          echo "::notice::Test Worker settings accessible; no credentials or binding values logged"
          # Verify isolated KV and D1 targets; never modify the production Worker.
          api "$tmp/prod.json" "$base/deep-cinema/settings"
          python3 - "$tmp/test.json" "$tmp/prod.json" <<'PY'
          import json, sys
          def stores(path):
              with open(path) as f:
                  bindings = json.load(f)["result"]["bindings"]
              result = {}
              for b in bindings:
                  if b.get("type") in ("kv_namespace", "d1"):
                      ident = b.get("namespace_id") or b.get("id") or b.get("database_id")
                      if not ident:
                          raise SystemExit("Cannot verify storage isolation")
                      result[b["name"]] = (b["type"], ident)
              return result
          test, prod = map(stores, sys.argv[1:])
          if not all(n in test and n in prod for n in ("DATA", "SOCIAL")):
              raise SystemExit("Cannot verify DATA and SOCIAL isolation")
          if set(test.values()) & set(prod.values()):
              raise SystemExit("Refusing deployment: test and production share storage")
          print("Test KV/D1 isolation verified")
          PY
          if [[ "$MODE" == check ]]; then
            echo "Read-only connection and storage isolation check passed; no deployment"
            exit 0
          fi
          # Code-only API preserves settings, bindings, secrets and compatibility.
          api "$tmp/deploy.json" -X PUT "$target/content" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@tool/bridge/worker.js;filename=worker.js;type=application/javascript+module'
          echo "::notice::Cloudflare accepted test Worker code"
          api "$tmp/after.json" "$target/settings"
          for f in test after; do
            jq -S '.result | {bindings: (.bindings | sort_by(.name)),compatibility_date,compatibility_flags}' "$tmp/$f.json" > "$tmp/$f.config"
          done
          cmp -s "$tmp/test.config" "$tmp/after.config" || { echo "::error::Worker settings differ; inspect before further deployment"; exit 1; }
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 -H 'Accept: application/json' 'https://deep-cinema-test.deepworks-soft.workers.dev/status' -o "$tmp/status.json" && jq -e '.app == "deep-cinema-bridge"' "$tmp/status.json" >/dev/null; then
              for endpoint in capabilities inbox create join state heartbeat play pause seek mode kick transfer leave close; do
                code=$(curl -sS --max-time 12 -X POST -H 'Content-Type: application/json' -d '{}' -o "$tmp/party.json" -w '%{http_code}' "https://deep-cinema-test.deepworks-soft.workers.dev/party/$endpoint")
                [[ "$code" == 401 ]] || { echo "::error::Watch Party auth smoke failed for $endpoint ($code)"; exit 1; }
              done
              echo "::notice::Test Worker status and Watch Party unauthenticated rejection OK"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Test Worker health check failed; review deployment in Cloudflare"
          exit 1
  notify:
    if: always() && needs.validate.outputs.mode == 'deploy'
    needs: [validate, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify owner in Telegram
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RESULT: ${{ needs.cloudflare.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$TG" || -z "$CHAT" ]]; then echo "Telegram secrets unavailable"; exit 0; fi
          if [[ "$RESULT" == success ]]; then text="✅ Yo-ho: тестовый Worker обновлён и проверен"; else text="❌ Yo-ho: проверка или обновление тестового Worker не прошли"; fi
          jq -n --arg chat "$CHAT" --arg text "$text — $RUN_URL" '{chat_id:$chat,text:$text}' > message.json
          curl -fsS --max-time 20 -o /dev/null -H 'Content-Type: application/json' --data-binary @message.json "https://api.telegram.org/bot$TG/sendMessage"
