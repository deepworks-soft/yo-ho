name: Yo-ho — Watch Party production activation
on:
  push:
    branches: [automation/watch-party-0.8.96]
    paths: ['.github/workflows/owner-screenshot-deploy.yml']
permissions:
  contents: read
concurrency:
  group: yoho-cloudflare-production
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: 2a79e288516f8e0c8fb6395c89eda4586dcefe1f
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          ref: 86328e14879363e0b14d2d9fae139eebf8849a11
          path: party-base
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate exact source and full compatibility regression
        working-directory: tool/bridge
        run: |
          set -euo pipefail
          cp worker.js worker.mjs
          node --check worker.mjs
          for suite in identity external migration club social keys community chunks curated watch playlists; do
            node "${suite}_test.mjs" > "$RUNNER_TEMP/owner-suite.log" 2>&1 || { echo "::error::Failed suite $suite"; exit 1; }
            echo "OK $suite"
          done
      - name: Inspect live code, stage exact patch, verify and deploy production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CF_TOKEN" && "$CF_ACCOUNT" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Missing Cloudflare credentials"; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts"
          prod="$base/deep-cinema"
          test="$base/deep-cinema-test"
          api() {
            local out="$1"; shift
            local http
            http=$(curl --silent --show-error --max-time 45 --output "$out" --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$@") || return 1
            if [[ "$http" != 2* ]] || ! jq -e '.success == true' "$out" >/dev/null; then
              echo "::error::Cloudflare HTTP $http"
              return 1
            fi
          }
          getcode() {
            local key="$1" target="$2"
            curl -fsS --max-time 45 -H "Authorization: Bearer $CF_TOKEN" -D "$tmp/$key.headers" "$target/content/v2" -o "$tmp/$key.raw"
            python3 - "$tmp" "$key" <<'PY'
          import sys,pathlib,re,email,email.policy
          d=pathlib.Path(sys.argv[1]); k=sys.argv[2]
          h=(d/(k+'.headers')).read_text(errors='replace')
          types=re.findall(r'^content-type:\s*([^\r\n]+)',h,re.I|re.M)
          ctype=types[-1].strip() if types else ''
          raw=(d/(k+'.raw')).read_bytes(); name='worker.js'
          if ctype.lower().startswith('multipart/'):
              msg=email.message_from_bytes(('Content-Type: '+ctype+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw,policy=email.policy.default)
              modules=[]
              for part in msg.iter_parts():
                  n=part.get_filename() or part.get_param('name',header='content-disposition')
                  if n!='metadata': modules.append((n,part.get_payload(decode=True)))
              if len(modules)!=1: raise SystemExit('Refusing: not a single JS module')
              name,raw=modules[0]
              if not name or not re.fullmatch(r'[A-Za-z0-9_.-]+\.m?js',name): raise SystemExit('Refusing: unknown module name')
          elif not ('javascript' in ctype.lower() or 'text/plain' in ctype.lower()):
              raise SystemExit('Refusing: unknown content type')
          raw.decode('utf-8')
          (d/(k+'.mjs')).write_bytes(raw)
          (d/(k+'.module')).write_text(name)
          PY
          }
          api "$tmp/prod.settings" "$prod/settings"
          api "$tmp/test.settings" "$test/settings"
          python3 - "$tmp/prod.settings" "$tmp/test.settings" <<'PY'
          import json,sys
          def read(p):
              b=json.load(open(p))['result']['bindings']
              names={x['name'] for x in b}
              stores={}
              for x in b:
                  if x.get('type') in ('kv_namespace','d1'):
                      v=x.get('namespace_id') or x.get('id') or x.get('database_id')
                      if not v: raise SystemExit('Cannot verify storage isolation')
                      stores[x['name']]=(x['type'],v)
              if not {'DATA','SOCIAL','SESSION_SECRET','TELEGRAM_TOKEN','TELEGRAM_CHAT'} <= names or not {'DATA','SOCIAL'} <= stores.keys(): raise SystemExit('Required bindings missing')
              return stores
          a,b=map(read,sys.argv[1:])
          if set(a.values()) & set(b.values()): raise SystemExit('Refusing shared storage')
          print('Required bindings and isolated test KV/D1 verified')
          PY
          getcode prod "$prod"
          getcode test "$test"
          api "$tmp/versions.json" "$prod/deployments"
          jq -e '.result.deployments | length > 0' "$tmp/versions.json" >/dev/null
          jq -r '.result.deployments[0] | "Prior production deployment: "+(.id // "unknown")' "$tmp/versions.json"
          node --check "$tmp/prod.mjs" >/dev/null 2>&1
          node --check "$tmp/test.mjs" >/dev/null 2>&1
          python3 - "$tmp" <<'PY'
          import pathlib,sys,hashlib
          d=pathlib.Path(sys.argv[1])
          old=pathlib.Path('party-base/tool/bridge/worker.js').read_text()
          new=pathlib.Path('tool/bridge/worker.js').read_text()
          live=(d/'prod.mjs').read_text()
          marker='// Watch Party: pure room state machine; server clock, no media URLs.'
          if new.count(marker)!=1 or marker in old or marker in live:
              raise SystemExit('Refusing: unexpected Watch Party source state')
          suffix=new[new.index(marker):]
          pairs=[
              ('      await resumeErasures(env);\n','      await resumeErasures(env);\n      await partyCleanup(env).catch(() => {});\n'),
              ("      if (url.pathname.startsWith('/playlists/')) return communityPlaylists(request, url, env);\n","      if (url.pathname.startsWith('/playlists/')) return communityPlaylists(request, url, env);\n      if (url.pathname.startsWith('/party/')) return watchParty(request, url, env);\n"),
              ('  await Promise.all([socialInit(env),qualityInit(env),communityPlaylistSchema(db),tguInit(env)]);\n  await db.batch([','  await Promise.all([socialInit(env),qualityInit(env),communityPlaylistSchema(db),tguInit(env)]);\n  await partyCleanup(env,user);\n  await db.batch(['),
              ("      db.prepare('DELETE FROM advice WHERE src = ? OR dst = ?').bind(user, user),\n    ]);\n  } catch {}\n}","      db.prepare('DELETE FROM advice WHERE src = ? OR dst = ?').bind(user, user),\n    ]);\n    await partyCleanup(env,user);\n  } catch {}\n}")
          ]
          def apply(text):
              for a,b in pairs:
                  if text.count(a)!=1 or b in text:
                      raise SystemExit('Refusing: unique prerequisite context missing')
                  text=text.replace(a,b,1)
              return text
          base_patch=apply(old)
          if (base_patch.rstrip()+'\n\n'+suffix).rstrip()!=new.rstrip():
              raise SystemExit('Refusing: source contains changes outside approved Watch Party scope')
          patched=apply(live)
          candidate=patched.rstrip()+'\n\n'+suffix
          reverse=patched
          for a,b in reversed(pairs):
              if reverse.count(b)!=1:
                  raise SystemExit('Refusing: non-reversible change')
              reverse=reverse.replace(b,a,1)
          if reverse!=live:
              raise SystemExit('Refusing: unrelated live code changed')
          (d/'candidate.mjs').write_text(candidate)
          print('Only approved Watch Party insertion blocks applied to live code')
          print('Candidate SHA256: '+hashlib.sha256(candidate.encode()).hexdigest())
          PY
          node --check "$tmp/candidate.mjs" >/dev/null 2>&1
          cp "$tmp/candidate.mjs" tool/bridge/worker.mjs
          for suite in identity external migration club social keys community chunks curated watch playlists; do
            (cd tool/bridge && node "$suite"_test.mjs) > "$tmp/suite.log" 2>&1 || { echo "::error::Patched live code failed suite $suite"; exit 1; }
            echo "Patched live OK $suite"
          done
          deploy() {
            local target="$1" module="$2" file="$3"
            local metadata
            metadata=$(jq -nc --arg m "$module" '{main_module:$m}')
            api "$tmp/deploy.json" -X PUT "$target/content" \
              -F "metadata=$metadata;type=application/json" \
              -F "$module=@$file;filename=$module;type=application/javascript+module"
          }
          settings_equal() {
            local key="$1" target="$2"
            api "$tmp/$key.after" "$target/settings" || return 1
            for f in "$key.settings" "$key.after"; do
              jq -S '.result | {bindings:(.bindings|sort_by(.name)),compatibility_date,compatibility_flags}' "$tmp/$f" > "$tmp/$f.config"
            done
            cmp -s "$tmp/$key.settings.config" "$tmp/$key.after.config"
          }
          smoke() {
            local origin="$1" code
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 15 "$origin/status" -o "$tmp/status.json" && jq -e '.app=="deep-cinema-bridge"' "$tmp/status.json" >/dev/null; then
                code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$origin/img/pl-00000000-0000-0000-0000-000000000000-00000000000000000000000000000000.jpg") || code=000
                if [[ "$code" == 401 ]]; then
                  code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$origin/club/curated") || code=000
                  if [[ "$code" == 401 ]]; then
                    code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$origin/playlists/list") || code=000
                    if [[ "$code" == 401 ]]; then
                      for endpoint in capabilities inbox create join state heartbeat play pause seek mode kick transfer leave close; do
                        code=$(curl -sS --max-time 12 -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "$origin/party/$endpoint") || return 1
                        [[ "$code" == 401 ]] || return 1
                      done
                      return 0
                    fi
                  fi
                fi
              fi
              sleep 5
            done
            return 1
          }
          tmod=$(cat "$tmp/test.module")
          pmod=$(cat "$tmp/prod.module")
          deploy "$test" "$tmod" "$tmp/candidate.mjs"
          if ! settings_equal test "$test" || ! smoke 'https://deep-cinema-test.deepworks-soft.workers.dev'; then
            deploy "$test" "$tmod" "$tmp/test.mjs"
            echo "::error::Test verification failed, original test code restored"
            exit 1
          fi
          echo "Test Worker passed health, cover, curated, playlist and Watch Party anonymous rejection; bindings unchanged"
          getcode current "$prod"
          cmp -s "$tmp/current.mjs" "$tmp/prod.mjs" || { echo "::error::Production changed concurrently"; exit 1; }
          settings_equal prod "$prod" || { echo "::error::Production settings changed concurrently"; exit 1; }
          if ! cmp -s "$tmp/prod.mjs" "$tmp/candidate.mjs"; then
            deploy "$prod" "$pmod" "$tmp/candidate.mjs"
            if ! settings_equal prod "$prod" || ! smoke 'https://deep-cinema.deepworks-soft.workers.dev'; then
              deploy "$prod" "$pmod" "$tmp/prod.mjs"
              echo "::error::Production verification failed, original code restored"
              exit 1
            fi
          else
            smoke 'https://deep-cinema.deepworks-soft.workers.dev'
          fi
          echo "Production Watch Party patch verified; bindings unchanged; webhook not modified"
      - name: Notify owner
        if: always()
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          [[ -n "$TG" && -n "$CHAT" ]] || exit 0
          if [[ "$RESULT" == success ]]; then msg="✅ Yo-ho: основной Worker поддерживает совместный просмотр, проверки пройдены"; else msg="❌ Yo-ho: активация совместного просмотра на основном Worker не прошла проверку"; fi
          jq -nc --arg chat "$CHAT" --arg msg "$msg" '{chat_id:$chat,text:$msg}' > "$RUNNER_TEMP/notify.json"
          curl -fsS --max-time 20 -o /dev/null -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/notify.json" "https://api.telegram.org/bot$TG/sendMessage"
